server:
  port: 8081

spring:
  application:
    name: investigadores-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rica
    username: postgres
    password: 123456

  grpc:
    server:
      port: 9090

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: investigadores-service
      auto-offset-reset: earliest

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka